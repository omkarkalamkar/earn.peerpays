# nginx site config for app.yourdomain.com
# Place at: /etc/nginx/sites-available/peerpays
# Then: sudo ln -s /etc/nginx/sites-available/peerpays /etc/nginx/sites-enabled/
# Certbot will add the TLS (443) server block + HTTP->HTTPS redirect automatically.

server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com;

    # Serve the built React SPA
    root /var/www/peerpays/frontend/dist;
    index index.html;

    # Allow order-screenshot uploads (backend caps at 8MB)
    client_max_body_size 12M;

    # API
    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (websockets) - needs upgrade headers + long timeout
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Uploaded screenshots (served by the Node app)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
    }

    # Service worker must not be cached aggressively
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Never cache the app shell / manifest so new deploys load immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Content-hashed build assets can be cached forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
